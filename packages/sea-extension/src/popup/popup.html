<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Bridge</title>
    <style>
      body {
        width: 280px;
        padding: 16px;
        font-family: sans-serif;
        font-size: 14px;
      }
      input {
        width: 100%;
        margin: 4px 0 10px;
        padding: 6px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #connect {
        background: #1677ff;
        color: #fff;
      }
      #disconnect {
        background: #ff4d4f;
        color: #fff;
        margin-top: 6px;
      }
      #status {
        margin-bottom: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="status">⚪ 未连接</div>
    <label for="serverUrl">服务器地址</label>
    <input id="serverUrl" placeholder="ws://127.0.0.1:8000" />
    <label for="agentId">Agent ID</label>
    <input id="agentId" placeholder="desktop-a" />
    <button id="connect" type="button">连接</button>
    <button id="disconnect" type="button">断开</button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>

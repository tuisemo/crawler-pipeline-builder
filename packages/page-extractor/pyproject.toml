[project]
name = "page-extractor"
version = "0.1.0"
description = "CLI tool for single detail-page extraction with browser automation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "cssselect>=1.4.0",
    "lxml>=5.0.0",
    "playwright>=1.58.0",
    "readability-lxml>=0.8.1",
    "requests>=2.33.1",
    "trafilatura>=1.6.0",
]

[project.optional-dependencies]
archive = [
    "rarfile>=4.0",
    "py7zr>=0.20",
]

[project.scripts]
page-extractor = "page_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_extractor"]

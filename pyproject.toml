[project]
name = "sea-data"
version = "0.1.0"
description = "Web scraping page inspector with LLM-powered crawler script generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115.0",
    "openai>=2.32.0",
    "playwright>=1.58.0",
    "pydantic>=2.10.0",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]

[tool.setuptools]
packages = ["backend", "extraction", "prompts"]
py-modules = ["inspector", "llm_client", "main", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

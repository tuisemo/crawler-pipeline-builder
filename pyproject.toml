[project]
name = "crawler-workflow"
version = "0.1.0"
description = "DSL-based crawler orchestration workbench with workflow APIs and React frontend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.32.0",
    "page-extractor",
    "playwright>=1.58.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.32.0",
    "pymysql>=1.1.0",
    "DBUtils>=3.1.0",
    "redis>=5.0.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "fakeredis>=2.20.0",
]

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "tests*", "docs*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv.workspace]
members = ["packages/page-extractor"]

[tool.uv.sources]
page-extractor = { workspace = true }

commands:
  install: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m pip install -e .
  test: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m pytest -v
  lint: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m py_compile server.py inspector.py llm_client.py main.py backend\workflow_routes.py backend\workflow_executor.py backend\legacy_routes.py backend\workflow_schemas.py
  typecheck: echo "No dedicated typecheck configured"
  test-workflow: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m pytest tests\test_workflow_api.py -v
  test-legacy: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m pytest tests\test_legacy_api_regression.py -v

services:
  backend:
    start: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe server.py --port 8000
    stop: powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }"
    healthcheck: curl -sf http://127.0.0.1:8000/
    port: 8000
    depends_on: []

  frontend-dev:
    start: echo "Frontend dev server to be introduced on port 3101 during React migration"
    stop: powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 3101 -State Listen -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }"
    healthcheck: curl -sf http://127.0.0.1:3101/
    port: 3101
    depends_on: [backend]

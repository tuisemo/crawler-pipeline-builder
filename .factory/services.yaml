commands:
  install: uv sync
  test: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m pytest -v
  lint: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m py_compile server.py llm_client.py backend\assist_routes.py backend\assist_services.py backend\workflow_routes.py backend\workflow_services.py backend\workflow_executor.py backend\workflow_schemas.py
  typecheck: npm run build --prefix D:\WY-DATASETS\sea-data\frontend
  test-workflow: D:\WY-DATASETS\sea-data\.venv\Scripts\python.exe -m pytest tests\test_workflow_api.py -v
  test-frontend: npm run test --prefix D:\WY-DATASETS\sea-data\frontend

services:
  backend:
    start: powershell -NoProfile -ExecutionPolicy Bypass -File D:\WY-DATASETS\sea-data\.factory\start_backend.ps1
    stop: powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }"
    healthcheck: curl -sf http://127.0.0.1:8000/
    port: 8000
    depends_on: []

  frontend-dev:
    start: npm run dev --prefix D:\WY-DATASETS\sea-data\frontend -- --host 127.0.0.1 --port 3101 --strictPort
    stop: powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort 3101 -State Listen -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }"
    healthcheck: curl -sf http://127.0.0.1:3101/
    port: 3101
    depends_on: [backend]
